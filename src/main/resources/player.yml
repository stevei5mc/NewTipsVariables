#配置文件版本，勿动
version: 2
Device:
  OS:
    Android: "Android"
    iOS: "iOS"
    macOS: "macOS"
    Fire_OS: "Fire OS"
    Gear_VR: "Gear VR"
    HoloLens: "HoloLens"
    Windows_10: "Windows 10"
    Windows: "Windows"
    Dedicated: "Dedicated"
    tvOS: "tvOS"
    PlayStation: "PlayStation"
    Switch: "Switch"
    Xbox: "Xbox"
    Windows_Phone: "Windows Phone"
  Controls:
    Keyboard: Keyboard
    Touch: Touch
    pad: pad
    motion_controller: motion_controller
  UIProfile:
    classic: "classic ui"
    pocket: "pocket ui"
ping:
  value:
    medium: 80
    high: 120
  color:
    low: "§c"
    medium: "§e"
    high: "§a"
HP:
  value:
    medium: 9
    high: 15
  color:
    low: "§c"
    medium: "§e"
    high: "§a"
  dynamic:
    low: "§c{0}§7/§c{1}"
    medium: "§e{0}§7/§e{1}"
    high: "§a{0}§7/§a{1}"
Food:
  value:
    medium: 9
    high: 15
  color:
    empty: "§7{0}/{1}"
    low: "§c{0}§7/§c{1}"
    medium: "§e{0}§7/§e{1}"
    high: "§a{0}§7/§a{1}"