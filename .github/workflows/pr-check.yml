name: PR check

concurrency:
  group: pr-check-${{ github.event.pull_request.number || inputs.prNumber }}
  cancel-in-progress: false

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      prNumber:
        description: 'PR number'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: 获取信息
      id: getInfo
      uses: actions/github-script@v9
      with:
        script: |
          const prID = "${{ github.event.pull_request.number || inputs.prNumber }}";
          const onEventName = "${{ github.event_name }}";

          let repoName = "${{ github.repository }}";
          repoName = repoName.replace("${{ github.repository_owner }}/", "");

          if (onEventName == "workflow_dispatch") {
            const prNumber = Number(prID.trim());
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`输入的PR编号格式不正确。输入值为: ${prID}`);
            }
          }

          core.setOutput('artifactName', `${repoName}-PR_${prID}-Build-${{ github.run_number }}`);
          core.setOutput('actionUrl', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');
    - name: 拉取代码
      uses: actions/checkout@v7
      with:
        ref: refs/pull/${{ github.event.pull_request.number || inputs.prNumber }}/merge
    - name: 安装java8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: 缓存本地 maven 仓库
      uses: ./.github/actions/cacheMavenRepo
    - name: 获取并输出 pom.xml 的信息
      uses: ./.github/actions/getPomInfo
    - name: 构建
      run: mvn package --file pom.xml -B -V
    - name: 整理文件
      run: mkdir staging && cp target/*.jar staging && ls -lah ./staging
    - name: 收集构建文件
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.getInfo.outputs.artifactName }}
        path: staging