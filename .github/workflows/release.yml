name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: 获取信息
      id: getInfo
      uses: actions/github-script@v8
      with:
        script: |
          const onEventName = "${{ github.event_name }}";
          const refName = "${{ github.ref }}";

          let repoName = "${{ github.repository }}";
          repoName = repoName.replace("${{ github.repository_owner }}/", "");

          if (!refName.startsWith("refs/tags/")) {
            core.setFailed(`发布失败：仅支持 tag 触发，当前 ref 为 "${refName}"。`);
          }

          const version = refName.replace("refs/tags/", "");
          core.setOutput('version', `${version}`);
          core.setOutput('artifactName', `${repoName}-Release-${version}`);
          core.info(`Release version: ${version}`);

          core.setOutput('actionUrl', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');
    - name: 拉取代码
      uses: actions/checkout@v6
    - name: 安装java8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: 缓存本地 maven 仓库
      uses: ./.github/actions/cacheMavenRepo
    - name: 设置 pom.xml 的版本号
      run: |
        echo "::warning::对 pom.xml 中 project 版本号进行设置，设置的版本号为 ${{ steps.getInfo.outputs.version }}"
        mvn versions:set -DnewVersion=${{ steps.getInfo.outputs.version }}
    - name: 获取并输出 pom.xml 的信息
      uses: ./.github/actions/getPomInfo
    - name: 构建
      run: mvn package --file pom.xml -B -V
    - name: 整理文件
      run: mkdir staging && cp target/*.jar staging && ls -lah ./staging
    - name: 收集构建文件
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.getInfo.outputs.artifactName }}
        path: staging
    - name: 列出需要发布的文件
      run: ls -lah ./staging
    - name: 发布新版本
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.getInfo.outputs.version }}
        name: ${{ steps.getInfo.outputs.version }}
        token: ${{ github.token }}
        bodyFile: ./docs/changelogs/${{ steps.getInfo.outputs.version }}.md
        artifacts: ./staging/*.*